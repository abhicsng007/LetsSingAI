# Fastest public HTTPS URL: Render Web Service from this Dockerfile.
# Connect the GitHub repo, set AWS env vars, deploy.
services:
  - type: web
    name: letssingai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
      - key: BEDROCK_MODEL_ID
        value: us.amazon.nova-lite-v1:0
